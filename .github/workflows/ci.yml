name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: API smoke
        run: |
          PORT=3040 NODE_ENV=production node server/index.js &
          sleep 1
          curl -sf http://127.0.0.1:3040/api/health | grep -E 'leads.evob.org|GoSmile'
          curl -sf http://127.0.0.1:3040/api/leads | grep Ana
