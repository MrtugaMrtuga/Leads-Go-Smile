<!DOCTYPE html>
<html lang="pt-PT" style="background:#fafafa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#fafafa">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="GoSmile Leads">
    <title>GoSmile Leads · leads.evob.org</title>
    <link rel="canonical" href="https://leads.evob.org/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/look.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/logo_Gosmilesimple.png">
    <link rel="apple-touch-icon" href="/logo_Gosmilesimple.png">
    <style>
      #lock[hidden]{display:none !important}
      html:not(.is-unlocked) #root{display:none}
    </style>
    <script>
      (function () {
        try {
          if (sessionStorage.getItem('gosmile-leads-unlocked') === '1') {
            document.documentElement.classList.add('is-unlocked');
          }
        } catch (e) {}
      })();
    </script>
</head>
<body>
    <div id="lock" class="lock">
      <div class="lock-mark">
        <img src="/logo_Gosmilesimple.png" alt="GoSmile" width="144" height="144">
      </div>
      <form id="pin-form" class="lock-form" autocomplete="off">
        <input id="pin" class="hidden-pin" inputmode="numeric" maxlength="4" autocomplete="one-time-code" aria-label="PIN">
        <div class="pin-boxes" id="boxes">
          <span class="pin-box on" data-i="0"></span>
          <span class="pin-box" data-i="1"></span>
          <span class="pin-box" data-i="2"></span>
          <span class="pin-box" data-i="3"></span>
        </div>
        <button class="cta lock-enter" type="submit">Entrar</button>
        <p class="lock-err" id="pin-err"></p>
      </form>
    </div>
    <div id="root"></div>
    <script src="/pin.js"></script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
